<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7f8">
<title>Fintrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login" hidden></div>
<div id="app" hidden>
  <header class="top"><div><div class="top-sub" id="topSub"></div><h1 id="topTitle">Resumo</h1></div><div id="syncDot" class="sync" title=""></div></header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
  <button id="fab" class="fab" data-act="plus" aria-label="Adicionar">+</button>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="sheetWrap" class="sheet-wrap" hidden><div class="scrim" data-act="closeSheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileIn" accept=".xls,.xlsx,.csv,.ofx,.pdf" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/config.js"></script>
<script src="js/parsers.js"></script>
<script src="js/engine.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
