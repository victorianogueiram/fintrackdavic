<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f1ee">
<title>Fintrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* Fintrack — mobile first. Identidade: creme quente, card em degradê pastel, serifa itálica no título. */
:root {
  --bg: #f8f1ee; --card: #ffffff; --ink: #241b1e; --muted: #8f8284; --line: #eadfdb; --soft: #f4e3e6;
  --accent: #c4527f; --accent-ink: #ffffff; --ok: #3f8f5f; --warn: #c8741f; --bad: #c0394f;
  --ok-bg: #e4f2e9; --warn-bg: #fbeedd; --bad-bg: #fbe4e8; --alert-bg: #f4e3e5; --alert-ink: #8a2f4a;
  --hero: radial-gradient(120% 130% at 12% 8%, #fbe0e8 0%, rgba(251,224,232,0) 58%), radial-gradient(90% 110% at 92% 18%, #e3d5f1 0%, rgba(227,213,241,0) 62%), radial-gradient(110% 100% at 78% 105%, #f8dac4 0%, rgba(248,218,196,0) 62%), #f7e4e9;
  --hero-line: #ecd3dc; --track: rgba(255,255,255,.78);
  --radius: 22px; --shadow: 0 1px 2px rgba(70,30,40,.04), 0 8px 24px rgba(70,30,40,.05);
  --tile: #f3e9e5; --tile-line: #e3d2cd;
  --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#151113; --card:#201a1d; --ink:#f4ede9; --muted:#a3969b; --line:#33292d; --soft:#3a2630; --accent:#d46a93; --accent-ink:#1a0d14; --ok:#6cc08c; --warn:#e69a4d; --bad:#ef7388; --ok-bg:#183024; --warn-bg:#3a2a14; --bad-bg:#3a1a20; --alert-bg:#3a2429; --alert-ink:#f2b3c4;
  --hero: radial-gradient(120% 130% at 12% 8%, #5b2a42 0%, rgba(91,42,66,0) 60%), radial-gradient(90% 110% at 92% 18%, #3d2f5a 0%, rgba(61,47,90,0) 62%), radial-gradient(110% 100% at 78% 105%, #5a3a2c 0%, rgba(90,58,44,0) 62%), #2a1d25; --hero-line:#43303b; --track: rgba(255,255,255,.14); --shadow: none; --tile:#2d2327; --tile-line:#47363c; } }
:root[data-theme="dark"] { --tile:#2d2327; --tile-line:#47363c; --bg:#151113; --card:#201a1d; --ink:#f4ede9; --muted:#a3969b; --line:#33292d; --soft:#3a2630; --accent:#d46a93; --accent-ink:#1a0d14; --ok:#6cc08c; --warn:#e69a4d; --bad:#ef7388; --ok-bg:#183024; --warn-bg:#3a2a14; --bad-bg:#3a1a20; --alert-bg:#3a2429; --alert-ink:#f2b3c4;
  --hero: radial-gradient(120% 130% at 12% 8%, #5b2a42 0%, rgba(91,42,66,0) 60%), radial-gradient(90% 110% at 92% 18%, #3d2f5a 0%, rgba(61,47,90,0) 62%), radial-gradient(110% 100% at 78% 105%, #5a3a2c 0%, rgba(90,58,44,0) 62%), #2a1d25; --hero-line:#43303b; --track: rgba(255,255,255,.14); --shadow: none; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'DM Sans', -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 15px; line-height: 1.4; }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
b, strong { font-weight: 500; }
.serif { font-family: var(--serif); font-style: italic; font-weight: 500; }

#app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(110px + env(safe-area-inset-bottom)); }
.top { display: grid; grid-template-columns: 52px 1fr 92px; align-items: center; padding: 6px 0 4px; }
.top h1 { font-size: 32px; line-height: 1; text-align: center; letter-spacing: -.01em; }
.top-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; box-shadow: var(--shadow); }
.icon-btn.plain { background: none; border: 0; box-shadow: none; width: 40px; height: 40px; }
.icon-btn svg { width: 22px; height: 22px; }
.sync { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.sync.busy { background: var(--warn); } .sync.off { background: var(--bad); }
.banner { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 14px; margin-bottom: 12px; font-size: 13px; }

.ptabs { position: relative; display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 12px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { flex: none; padding: 12px 18px; border-radius: 99px; font-size: 16px; color: var(--muted); border: 1px solid transparent; }
.ptab.on { background: var(--card); color: var(--accent); border-color: var(--line); box-shadow: var(--shadow); font-weight: 500; }

.card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--line); }
.card h2 { font-size: 17px; font-weight: 500; color: var(--ink); margin-bottom: 10px; }
.card.hero { background: var(--hero); border-color: var(--hero-line); box-shadow: none; }
.big { font-size: 46px; font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.big .cur { font-size: .5em; font-weight: 400; margin-right: 5px; letter-spacing: 0; }
.mid { font-size: 21px; font-weight: 400; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; } .between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stack > * + * { margin-top: 10px; }
.money { font-variant-numeric: tabular-nums; font-weight: 400; white-space: nowrap; }
.pos { color: var(--ok); } .neg { color: var(--ink); } .orange { color: var(--warn); }

.bar { height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar.ok > i { background: var(--ok); } .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.bar.grad > i, .bar.grad.ok > i, .bar.grad.warn > i, .bar.grad.bad > i { background-image: linear-gradient(90deg, #4f9a6b 0%, #d9b73c 55%, #d2603e 100%); background-color: transparent; }
.hero .bar { background: var(--track); height: 6px; }
.hero .bar > i, .hero .bar.ok > i { background: var(--ink); } .hero .bar.warn > i { background: var(--warn); } .hero .bar.bad > i { background: var(--bad); }

.fab { position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 32px; line-height: 1; box-shadow: 0 10px 26px rgba(196,82,127,.38); z-index: 25; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 9px 15px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.btn { padding: 15px 18px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 500; width: 100%; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.small { padding: 10px 16px; width: auto; font-size: 13px; }
.link { color: var(--accent); font-weight: 500; font-size: 13px; }
.input { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); outline: none; }
.input:focus { border-color: var(--accent); }
label.f { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; }

.tx { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tx:last-child { border-bottom: 0; }
.tx .ic { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; }
.tx .ic svg { width: 20px; height: 20px; }
.tx .mid-col { flex: 1; min-width: 0; }
.tx .nm { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .sub { display: flex; gap: 6px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 99px; }
.acc { font-size: 11px; color: var(--muted); }
.day { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 14px 2px 4px; display: flex; justify-content: space-between; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.check.on { background: var(--accent); border-color: var(--accent); }

.cat-row { padding: 10px 0; }
.cat-row .row { margin-bottom: 6px; }
.note { padding: 13px 15px; border-radius: 16px; font-size: 14px; }
.note.warn { background: var(--warn-bg); } .note.ok { background: var(--ok-bg); } .note.bad { background: var(--bad-bg); }
.alert { display: flex; align-items: center; gap: 12px; background: var(--alert-bg); color: var(--alert-ink); border-radius: 24px; padding: 12px 12px 12px 14px; margin-bottom: 14px; }
.alert .ai { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
.alert .ai svg { width: 20px; height: 20px; }
.alert b { flex: 1; font-weight: 500; font-size: 16px; }
.opt { display: block; width: 100%; text-align: left; padding: 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); margin-bottom: 10px; }
.opt b { display: block; margin-bottom: 2px; font-weight: 500; } .opt span { color: var(--muted); font-size: 13px; }
.opt.on { border-color: var(--accent); background: var(--soft); }
.verdict { border-radius: 24px; padding: 20px; margin-bottom: 14px; }
.verdict.pode { background: var(--ok-bg); } .verdict.cabe, .verdict.espere { background: var(--warn-bg); } .verdict.nao { background: var(--bad-bg); }
.verdict h2 { font-family: var(--serif); font-style: italic; font-size: 30px; font-weight: 500; margin-bottom: 6px; }
.menu-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 16px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.menu-item:last-child { border-bottom: 0; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.seg { display: flex; background: var(--line); border-radius: 99px; padding: 4px; gap: 3px; margin-bottom: 10px; }
.seg button { flex: 1; padding: 9px; border-radius: 99px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }
.mnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.mnav button.arrow { width: 52px; height: 52px; border-radius: 50%; background: none; border: 1px solid var(--line); font-size: 20px; color: var(--ink); }
.mnav .mid-lbl { text-align: center; display: block; }
.mnav .mid-lbl b { display: inline-block; font-weight: 500; font-size: 16px; }
.mnav .mid-lbl span { color: var(--muted); font-size: 13px; margin-left: 6px; }
.cap { display: inline-block; } .cap::first-letter, .mnav b::first-letter { text-transform: uppercase; }
.selbar { position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; padding: 10px 16px; z-index: 22; }

.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(30,12,20,.45); }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 30px 30px 0 0; padding: 12px 18px calc(24px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
.sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast { white-space: pre-line; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 18px; z-index: 80; font-size: 14px; max-width: 90vw; text-align: center; }

.login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 380px; margin: 0 auto; padding: 24px; }
.login h1 { font-family: var(--serif); font-style: italic; font-size: 44px; font-weight: 500; margin-bottom: 6px; } .login p { color: var(--muted); margin-bottom: 22px; }
.login .input { margin-bottom: 10px; } .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-bottom: 8px; }

/* ---- painel (sheet) no estilo da conferência ---- */
.sh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 4px 0 18px; }
.sh-btn { display: flex; align-items: center; gap: 2px; justify-self: start; color: var(--ink); font-size: 16px; padding: 6px 0; }
.sh-btn svg, .sh-x svg { width: 20px; height: 20px; }
.sh-t { font-weight: 500; font-size: 19px; }
.sh-x { justify-self: end; width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink); }
.sh-x svg { width: 24px; height: 24px; }
.prog { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.prog .bar { flex: 1; height: 8px; }
.item-card { background: var(--tile); border: 1px solid var(--tile-line); border-radius: 24px; padding: 18px; }
.it-name { font-size: 27px; font-weight: 400; line-height: 1.15; letter-spacing: -.01em; }
.it-sub { margin: 8px 0 14px; font-size: 16px; }
.il { font-size: 13px; color: var(--muted); }
.bare { display: block; width: 100%; background: transparent; border: 0; outline: 0; padding: 4px 0; font-size: 17px; color: var(--ink); }
.bare::placeholder { color: var(--muted); }
.big-in { font-size: 38px; font-weight: 300; letter-spacing: -.02em; }
.nm-in { border-bottom: 1px solid var(--tile-line); padding-bottom: 10px; margin-bottom: 14px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-block; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; font-size: 14px; color: var(--ink); }
.pill.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill.plain { background: none; border: 0; padding-left: 4px; color: var(--muted); }
.pill.dt { font-family: inherit; }
.q-row { display: flex; align-items: center; gap: 10px; margin: 20px 2px 12px; font-size: 17px; }
.help { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: 13px; background: var(--card); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 9px; padding: 14px 6px 12px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); font-size: 13px; color: var(--ink); text-align: center; line-height: 1.2; }
.tile .ti { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
.tile .ti svg { width: 24px; height: 24px; }
.tile.on { background: var(--tile); border-color: var(--tile-line); box-shadow: inset 0 0 0 1px var(--tile-line); }
.tile.new { border-style: dashed; background: transparent; }
.btn.conferir { background: var(--tile); color: var(--ink); font-weight: 400; padding: 17px; }
.opt.row-opt { display: flex; align-items: center; gap: 14px; }
.opt .ti { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--accent); }
.opt .ti svg { width: 24px; height: 24px; }
.opt .sub { display: block; }
.illo { display: flex; justify-content: center; margin: 0 auto 8px; }
.illo svg { width: 170px; height: auto; }
.illo.small svg { width: 120px; }
.empty .illo { margin-bottom: 4px; }
.card.hero .illo svg { width: 150px; }
.login .illo { margin-bottom: 10px; }
.icon-btn svg { width: 24px; height: 24px; }
.tx .ic svg { width: 22px; height: 22px; }
.alert .ai svg { width: 22px; height: 22px; color: var(--alert-ink); }

/* Decidir: resultado */
.back-l { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 16px; } .back-l svg { width: 18px; height: 18px; }
.res-t { font-size: 46px; line-height: 1.02; margin: 12px 0 10px; font-weight: 400; }
.res-s { font-weight: 500; font-size: 17px; margin-bottom: 14px; }
.rbar { position: relative; height: 8px; border-radius: 99px; background: var(--track); } .rbar i { display: block; height: 100%; border-radius: 99px; background: var(--ink); } .rbar u { position: absolute; top: -4px; width: 2px; height: 16px; background: var(--ink); text-decoration: none; transform: translateX(-1px); }
.alert-soft { background: var(--warn-bg); border-radius: 18px; padding: 16px 18px; margin-bottom: 14px; font-size: 16px; line-height: 1.45; } .alert-soft .link { font-size: inherit; }
.next-t { font-size: 18px; line-height: 1.5; }
.ul-l { display: block; text-decoration: underline; text-underline-offset: 6px; font-size: 16px; padding: 4px 0; }
.btn.dark { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px; } .btn.dark svg { width: 20px; height: 20px; }

/* Decidir: fila "para decidir hoje" */
.segs { display: flex; gap: 6px; margin-bottom: 16px; } .segs i { flex: 1; height: 3px; border-radius: 9px; background: var(--line); } .segs i.on { background: var(--ink); }
.dq { padding: 18px; }
.dq-ic { width: 46px; height: 46px; border-radius: 14px; background: var(--tile); display: grid; place-items: center; } .dq-ic svg { width: 22px; height: 22px; }
.dq-v { font-size: 52px; font-weight: 300; line-height: 1; letter-spacing: -.02em; } .dq-v small { font-size: 18px; font-weight: 400; letter-spacing: 0; }
.dq-opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 17px 18px; border-radius: 18px; background: var(--tile); margin-bottom: 8px; font-size: 16px; }
.dq-opt em { font-style: normal; color: var(--muted); font-size: 13px; } .dq-opt.dark { background: var(--ink); color: var(--bg); } .dq-opt.dark em { color: inherit; opacity: .7; }
.ul-l.small { display: inline; font-size: 14px; color: var(--ink); }

/* Metas */
.rg-w { position: relative; flex: none; display: grid; place-items: center; } .rg-w b { position: absolute; font-weight: 400; font-size: 22px; } .rg-w.sm b { font-size: 15px; }
.prox { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 18px; padding: 10px 14px 10px 10px; border-radius: 18px; background: rgba(255,255,255,.55); text-align: left; } .prox .grow { flex: 1; display: flex; flex-direction: column; } .prox b { font-weight: 500; font-size: 17px; } .prox svg { width: 18px; height: 18px; }
.th { width: 46px; height: 46px; border-radius: 12px; background: var(--tile) center/cover; display: grid; place-items: center; } .th svg { width: 22px; height: 22px; }
.stories { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 16px; scrollbar-width: none; } .stories::-webkit-scrollbar { display: none; }
.story { flex: none; width: 88px; display: flex; flex-direction: column; align-items: center; gap: 2px; } .story b { font-weight: 500; font-size: 15px; margin-top: 6px; } .story small { font-size: 13px; }
.sc { position: relative; width: 84px; height: 84px; display: grid; place-items: center; } .sc .rg { position: absolute; inset: 0; width: 84px; height: 84px; } .sc.plus { border: 1px solid var(--line); border-radius: 50%; } .sc.plus svg { width: 26px; height: 26px; }
.si { width: 70px; height: 70px; border-radius: 50%; background: var(--tile) center/cover; display: grid; place-items: center; } .si svg { width: 24px; height: 24px; }
.mcard { background: var(--card); border-radius: 28px; overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.cover { position: relative; height: 190px; background: center/cover; display: flex; align-items: flex-end; cursor: pointer; } .cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(30,15,20,.6)); } .cover.none { background: var(--hero); } .cover.none::after { background: none; }
.cv-ic svg { width: 44px; height: 44px; opacity: .45; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); }

<script>
/* Fintrack — leitores de extrato/fatura (Itaú). Funciona no navegador e no Node (testes). */
(function (root) {
  'use strict';

  const brNum = (s) => {
    if (s == null) return NaN;
    if (typeof s === 'number') return s;
    const t = String(s).replace(/R\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
    return parseFloat(t);
  };
  const iso = (d, m, y) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const cleanName = (s) => s.replace(/\s+/g, ' ').trim();

  /* ---------- Categoria do cartão Itaú -> categoria Fintrack ---------- */
  const CARD_CAT = {
    'transporte': 'Transporte', 'supermercado': 'Alimentação', 'restaurante': 'Alimentação',
    'serviços': 'Assinaturas', 'saúde': 'Saúde', 'lazer': 'Lazer', 'casa': 'Moradia',
    'vestuário': 'Vestuário', 'educação': 'Educação', 'viagem': 'Lazer', 'eletronicos': 'Compras',
    'outros': null
  };

  /* ---------- PDF de fatura do cartão Itaú ----------
     Entrada: lista de páginas, cada uma com items {str,x,y}. (gerado por pdf.js)
     Saída: {lancamentos[], parcelasFuturas[], resumo{}} */
  function groupLines(items, pageWidth) {
    // acha as âncoras de coluna pela posição X das datas "DD/MM"
    const dateX = items.filter(i => /^\d{2}\/\d{2}$/.test(i.str.trim())).map(i => Math.round(i.x));
    const uniq = [...new Set(dateX)].sort((a, b) => a - b);
    const left = uniq.length ? uniq[0] : 0;
    const rightC = uniq.find(x => x - left > 120);
    const splitX = rightC != null ? rightC - 6 : Infinity;
    const cols = { L: [], R: [] };
    items.forEach(it => { if (it.str.trim()) (it.x >= splitX ? cols.R : cols.L).push(it); });
    const out = [];
    ['L', 'R'].forEach(c => {
      const rows = [];
      cols[c].sort((a, b) => b.y - a.y || a.x - b.x).forEach(it => {
        const r = rows.find(r => Math.abs(r.y - it.y) < 2.5);
        if (r) r.items.push(it); else rows.push({ y: it.y, items: [it] });
      });
      rows.sort((a, b) => b.y - a.y).forEach(r => {
        r.items.sort((a, b) => a.x - b.x);
        let txt = '', prevEnd = null;
        r.items.forEach(i => {
          const gap = prevEnd == null ? 0 : i.x - prevEnd;
          if (prevEnd != null && gap > 1.2) txt += ' ';
          txt += i.str.trim(); prevEnd = i.x + (i.w || 0);
        });
        out.push({ col: c, y: r.y, text: cleanName(txt), cells: r.items });
      });
    });
    return out;
  }

  function parseItauCardPages(pages) {
    const lines = [];
    pages.forEach((p, pi) => groupLines(p.items, p.width).forEach(l => lines.push({ ...l, page: pi })));
    const full = lines.map(l => l.text).join('\n');

    const resumo = {};
    const m = (re) => { const r = full.match(re); return r ? r[1] : null; };
    resumo.total = brNum(m(/Total desta fatura\s+([\d.]+,\d{2})/));
    resumo.vencimento = m(/Vencimento:\s*(\d{2}\/\d{2}\/\d{4})/);
    resumo.fechamento = m(/Postagem:\s*(\d{2}\/\d{2}\/\d{4})/);
    resumo.proxFechamento = m(/pr[óo]x\.? Fechamento:\s*(\d{2}\/\d{2}\/\d{4})/i);
    resumo.limite = brNum(m(/Limite total de cr[ée]dito\s+([\d.]+,\d{2})/));
    resumo.limiteDisponivel = brNum(m(/Limite dispon[ií]vel\s+([\d.]+,\d{2})/));
    resumo.faturaAnterior = brNum(m(/Total da fatura anterior\s+([\d.]+,\d{2})/));
    const pag = full.match(/Pagamento efetuado em (\d{2}\/\d{2}\/\d{4})\s+-?([\d.]+,\d{2})/);
    if (pag) { resumo.pagamentoData = pag[1]; resumo.pagamentoValor = brNum(pag[2]); }

    // ano de referência: vencimento (fatura que vence em out/2026 tem compras de ago-out/2026)
    const refYear = resumo.vencimento ? +resumo.vencimento.slice(6) : new Date().getFullYear();
    const refMonth = resumo.vencimento ? +resumo.vencimento.slice(3, 5) : 12;
    const yearFor = (mm) => (mm > refMonth ? refYear - 1 : refYear);

    const lancamentos = [], parcelasFuturas = [];
    let section = null; // 'compras' | 'inter' | 'prodserv' | 'futuras' | 'pagamentos' | null
    const reItem = /^(\d{2})\/(\d{2})\s+(.+?)\s+(-?[\d.]+,\d{2})$/;
    const reItemInter = /^(\d{2})\/(\d{2})\s+(.+?)\s+(-?[\d.]+,\d{2})$/;
    const reInst = /\s(\d{2})\/(\d{2})$/;

    for (let i = 0; i < lines.length; i++) {
      const t = lines[i].text;
      if (/^Pagamentos efetuados/i.test(t)) { section = 'pagamentos'; continue; }
      if (/^Lançamentos: compras e saques/i.test(t)) { section = 'compras'; continue; }
      if (/^Lançamentos internacionais/i.test(t)) { section = 'inter'; continue; }
      if (/^Lançamentos: produtos e serviços/i.test(t)) { section = 'prodserv'; continue; }
      if (/^Compras parceladas - próximas faturas/i.test(t)) { section = 'futuras'; continue; }
      if (/^(Limites de cr[ée]dito|Encargos cobrados)/i.test(t)) { section = null; continue; }
      if (/^(Total dos pagamentos|Lançamentos no cartão|Total transações inter|Total dos lançamentos|Próxima fatura|Demais faturas|Total para próximas)/i.test(t)) continue;
      if (section === 'pagamentos') continue;

      if (section === 'compras' || section === 'prodserv') {
        const mm = t.match(reItem);
        if (!mm || /^(DATA)/.test(t)) continue;
        const dia = +mm[1], mes = +mm[2];
        let nome = mm[3], valor = brNum(mm[4]);
        // linha seguinte: "categoria CIDADE"
        let cat = null;
        const next = lines[i + 1];
        if (next && next.col === lines[i].col && !/^\d{2}\/\d{2}\s/.test(next.text) && !/\d,\d{2}$/.test(next.text)) {
          cat = next.text.split(' ')[0].toLowerCase();
        } else if (next && next.col === lines[i].col && /^[a-zçãéíóúâêô]+\s/.test(next.text) && !/^\d{2}\/\d{2}\s/.test(next.text)) {
          cat = next.text.split(' ')[0].toLowerCase();
        }
        let parcela = null;
        const pi = nome.match(reInst);
        if (pi && +pi[2] > 1 && +pi[1] <= +pi[2]) { parcela = { n: +pi[1], de: +pi[2] }; nome = nome.replace(reInst, ''); }
        if (section === 'prodserv') cat = 'tarifa';
        lancamentos.push({
          data: iso(dia, mes, yearFor(mes)), nome: cleanName(nome), valor: -valor,
          cartaoCat: cat, categoriaSugerida: CARD_CAT[cat] || null, parcela, origem: 'cartao'
        });
      } else if (section === 'inter') {
        // "07/09 ANTHROPIC* CLAUDE SUBAN   116,91" + linha "110,00 BRL 21,57"
        const mm = t.match(/^(\d{2})\/(\d{2})\s+(.+?)\s+([\d.]+,\d{2})$/);
        if (mm && !/^DATA/.test(t)) {
          lancamentos.push({
            data: iso(+mm[1], +mm[2], yearFor(+mm[2])), nome: cleanName(mm[3]), valor: -brNum(mm[4]),
            cartaoCat: 'internacional', categoriaSugerida: null, parcela: null, origem: 'cartao', internacional: true
          });
        } else if (/^Repasse de IOF em R\$\s+([\d.]+,\d{2})/.test(t)) {
          const v = brNum(t.match(/([\d.]+,\d{2})$/)[1]);
          lancamentos.push({
            data: iso(+resumo.fechamento.slice(0, 2), +resumo.fechamento.slice(3, 5), +resumo.fechamento.slice(6)),
            nome: 'IOF compra internacional', valor: -v, cartaoCat: 'tarifa', categoriaSugerida: null, parcela: null, origem: 'cartao'
          });
        }
      } else if (section === 'futuras') {
        const mm = t.match(reItem);
        if (!mm || /^DATA/.test(t)) continue;
        const pi = mm[3].match(reInst);
        if (!pi) continue;
        parcelasFuturas.push({
          dataCompra: iso(+mm[1], +mm[2], yearFor(+mm[2])), nome: cleanName(mm[3].replace(reInst, '')),
          n: +pi[1], de: +pi[2], valor: brNum(mm[4])
        });
      }
    }
    // "Demais faturas" / "Próxima fatura"
    resumo.proximaFatura = brNum((full.match(/Próxima fatura\s+([\d.]+,\d{2})/) || [])[1]);
    resumo.demaisFaturas = brNum((full.match(/Demais faturas\s+([\d.]+,\d{2})/) || [])[1]);
    resumo.somaLancamentos = Math.round(lancamentos.reduce((s, l) => s - l.valor, 0) * 100) / 100;
    return { lancamentos, parcelasFuturas, resumo };
  }

  /* ---------- Extrato conta corrente Itaú (.xls via SheetJS) ---------- */
  function parseItauXLS(rows, today) {
    // rows: array de arrays (sheet "Lançamentos")
    const out = []; let saldoInicial = null;
    let hi = rows.findIndex(r => String(r[0] || '').trim().toLowerCase() === 'data');
    if (hi < 0) return { transacoes: [], saldoInicial: null, erro: 'cabeçalho não encontrado' };
    const hoje = today || new Date();
    for (let i = hi + 1; i < rows.length; i++) {
      const r = rows[i]; if (!r || !r[0]) continue;
      const nome = String(r[1] || '').trim();
      if (/^SALDO ANTERIOR/i.test(nome)) { saldoInicial = brNum(r[4]); continue; }
      if (/^SALDO TOTAL/i.test(nome) || /^SALDO/i.test(nome)) continue;
      const dm = String(r[0]).match(/(\d{2})\/(\d{2})\/(\d{4})/); if (!dm) continue;
      const d = new Date(+dm[3], +dm[2] - 1, +dm[1]); if (d > hoje) continue; // sem lançamentos futuros
      const valor = typeof r[3] === 'number' ? r[3] : brNum(r[3]); if (isNaN(valor)) continue;
      out.push({
        data: iso(+dm[1], +dm[2], +dm[3]), nome: cleanName(nome.replace(/\s*\d{2}\/\d{2}$/, '')),
        valor, origem: 'conta', transferenciaFatura: /FATURA PAGA|PAGTO.*FATURA|PAGAMENTO.*CART/i.test(nome)
      });
    }
    return { transacoes: out, saldoInicial };
  }

  /* ---------- OFX e CSV genéricos ---------- */
  function parseOFX(text) {
    const out = [];
    const blocks = text.split(/<STMTTRN>/i).slice(1);
    blocks.forEach(b => {
      const g = (tag) => { const m = b.match(new RegExp('<' + tag + '>([^<\\r\\n]+)', 'i')); return m ? m[1].trim() : ''; };
      const dt = g('DTPOSTED'); const amt = parseFloat(g('TRNAMT').replace(',', '.'));
      if (!dt || isNaN(amt)) return;
      out.push({ data: iso(+dt.slice(6, 8), +dt.slice(4, 6), +dt.slice(0, 4)), nome: cleanName(g('MEMO') || g('NAME')), valor: amt, origem: 'conta',
        transferenciaFatura: /FATURA PAGA|PAGTO.*FATURA/i.test(g('MEMO')) });
    });
    return out;
  }
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const lines = text.split(/\r?\n/).filter(Boolean);
    const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
    const split = (l) => { const r = []; let c = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { r.push(c); c = ''; } else c += ch; } r.push(c); return r; };
    const head = split(lines[0]).map(h => h.toLowerCase());
    const iD = head.findIndex(h => /data/.test(h)), iN = head.findIndex(h => /(descri|lan[cç]amento|hist)/.test(h)), iV = head.findIndex(h => /valor/.test(h));
    if (iD < 0 || iV < 0) return [];
    return lines.slice(1).map(l => {
      const c = split(l); const dm = (c[iD] || '').match(/(\d{2})\/(\d{2})\/(\d{4})/); if (!dm) return null;
      const v = brNum(c[iV]); if (isNaN(v)) return null;
      return { data: iso(+dm[1], +dm[2], +dm[3]), nome: cleanName(c[iN] || ''), valor: v, origem: 'conta' };
    }).filter(Boolean);
  }

  const api = { brNum, parseItauCardPages, parseItauXLS, parseOFX, parseCSV, CARD_CAT };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.FTParsers = api;
})(typeof window !== 'undefined' ? window : globalThis);

/* Fintrack — login (nick + senha) e sincronização via funções do Supabase. Sem SDK. */
(function (root) {
  'use strict';
  const C = root.FT_CONFIG;
  const LS = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }, del: (k) => { try { localStorage.removeItem(k); } catch (e) {} } };

  async function rpc(fn, args) {
    let res;
    try {
      res = await fetch(C.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: C.key, Authorization: 'Bearer ' + C.key }, body: JSON.stringify(args || {}) });
    } catch (e) { const err = new Error('sem conexão'); err.offline = true; throw err; }
    const txt = await res.text(); let body = null; try { body = txt ? JSON.parse(txt) : null; } catch (e) { body = txt; }
    if (!res.ok) { const err = new Error((body && body.message) || 'erro ' + res.status); err.status = res.status; err.invalidSession = /sessao invalida/.test(err.message); throw err; }
    return body;
  }
  const Cloud = {
    token: () => LS.get('ft2_token'), nick: () => LS.get('ft2_nick'),
    async login(nick, pass) { const t = await rpc('ft_login', { p_nick: nick, p_pass: pass }); LS.set('ft2_token', t); LS.set('ft2_nick', nick.trim().toLowerCase()); return t; },
    async register(nick, pass) { const t = await rpc('ft_register', { p_nick: nick, p_pass: pass }); LS.set('ft2_token', t); LS.set('ft2_nick', nick.trim().toLowerCase()); return t; },
    load: () => rpc('ft_load', { p_token: Cloud.token() }),
    save: (data) => rpc('ft_save', { p_token: Cloud.token(), p_data: data }),
    async logout() { try { await rpc('ft_logout', { p_token: Cloud.token() }); } catch (e) {} LS.del('ft2_token'); },
    LS
  };
  root.FTCloud = Cloud;
})(window);

</script>

  function catChart() {

  /* ----- Seções extras ----- */

  async function readFileLines(file) {

      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; const pages = [];
      for (let i = 1; i <= doc.numPages; i++) { const pg = await doc.getPage(i); const vp = pg.getViewport({ scale: 1 }); const tc = await pg.getTextContent(); pages.push({ width: vp.width, items: tc.items.map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width })) }); }
      const r = P.parseItauCardPages(pages);
      if (!r.lancamentos.length || !r.resumo.total) throw new Error('Não reconheci essa fatura. Se puder, envie o arquivo da fatura em CSV ou o PDF original do Itaú.');

    }
    if (/\.(xls|xlsx)$/.test(name)) {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); const sh = wb.Sheets['Lançamentos'] || wb.Sheets[wb.SheetNames[0]];
      const r = P.parseItauXLS(XLSX.utils.sheet_to_json(sh, { header: 1, raw: true }), new Date());
      if (!r.transacoes.length) throw new Error('Não encontrei lançamentos nesse Excel.');
      return { lines: r.transacoes, source: 'extrato' };

    const pills = (id, act, opts, sel) => '<div class="pills" id="' + id + '">' + opts.map(([k, l]) => '<button class="pill' + (sel === k ? ' on' : '') + '" data-act="' + act + '" data-v="' + k + '">' + l + '</button>').join('') + '</div>';
    openSheet(sheetHead(c ? 'Editar despesa' : 'Nova despesa') + '<div class="item-card"><span class="il">Valor</span><input class="bare big-in" id="cVal" inputmode="numeric" data-mask="money" placeholder="R$ 0,00" value="' + (val !== '' ? fmtIn(val) : '') + '"><input class="bare nm-in" id="cNome" placeholder="Nome, ex.: Aluguel, Internet" value="' + esc(c ? c.nome : '') + '"><span class="il" style="display:block;margin-top:12px">Tipo</span>' + pills('ctTipos', 'ctTipo', [['fixa', 'Fixa'], ['variavel', 'Variável']], ctTipo) + '<span class="il" style="display:block;margin-top:12px">Saída</span>' + pills('ctSaidas', 'ctSaida', [['cc', 'Conta corrente'], ['cartao', 'Cartão'], ['outra', 'Outra fonte']], ctSaida) + '<p class="muted small" style="margin-top:6px">"Outra fonte": por exemplo, auxílio home office.</p><span class="il" style="display:block;margin-top:12px">Dia do vencimento (opcional)</span><input class="bare nm-in" id="cDia" inputmode="numeric" maxlength="2" placeholder="Ex.: 10" value="' + (c && c.dia ? c.dia : '') + '"></div>' +
      '<p class="muted small" style="margin:10px 4px 0">Variável: o valor vale só para ' + esc(E.monthLabel(m)) + '. Fixa: vale para todos os meses.</p><div style="height:16px"></div><div class="stack"><button class="btn" data-act="saveConta" data-id="' + (c ? c.id : '') + '">Salvar</button>' + (c ? '<button class="btn danger" data-act="delConta" data-id="' + c.id + '">Excluir</button>' : '') + '</div>');
  }
  let subForma = 'cartao', subImp = 2;
  function sheetSub(s) {
    subForma = s ? s.forma || 'cartao' : 'cartao'; subImp = s ? s.imp || 2 : 2;
    openSheet(sheetHead(s ? 'Editar assinatura' : 'Nova assinatura') + '<div class="item-card"><span class="il">Quanto custa por mês?</span><input class="bare big-in" id="sVal" inputmode="numeric" data-mask="money" placeholder="R$ 0,00" value="' + (s ? fmtIn(s.valor) : '') + '"><input class="bare nm-in" id="sNome" placeholder="Nome, ex.: Netflix, Spotify" value="' + esc(s ? s.nome : '') + '"><span class="il" style="display:block;margin-top:12px">Paga como?</span><div class="pills" id="subFormas"><button class="pill' + (subForma === 'cartao' ? ' on' : '') + '" data-act="subForma" data-v="cartao">Cartão de crédito</button><button class="pill' + (subForma === 'pix' ? ' on' : '') + '" data-act="subForma" data-v="pix">PIX</button></div><span class="il" style="display:block;margin-top:12px">Importância</span><div class="pills" id="subImps">' + [1, 2, 3].map((n) => '<button class="pill' + (subImp === n ? ' on' : '') + '" data-act="subImp" data-v="' + n + '">' + '⭐'.repeat(n) + '</button>').join('') + '</div><span class="il" style="display:block;margin-top:12px">Dia da cobrança</span><input class="bare nm-in" id="sDia" inputmode="numeric" maxlength="2" placeholder="Ex.: 15" value="' + (s ? s.dia : '') + '"></div><div style="height:16px"></div><div class="stack"><button class="btn" data-act="saveSub" data-id="' + (s ? s.id : '') + '">Salvar</button>' + (s ? '<button class="btn danger" data-act="delSub" data-id="' + s.id + '">Excluir</button>' : '') + '</div>');
  }
  let metaImg = null;
  function sheetMeta(m) {
    metaImg = m && m.img ? m.img : null;
    openSheet(sheetHead(m ? 'Editar meta' : 'Nova meta') + '<div class="img-up" id="mImgBox"' + (metaImg ? ' style="background-image:url(' + metaImg + ')"' : '') + '><label class="img-btn">' + ic('plus') + '<span>' + (metaImg ? 'Trocar imagem' : 'Adicionar imagem') + '</span><input type="file" id="mImgIn" accept="image/*" hidden></label>' + (metaImg ? '<button class="img-x" data-act="mImgDel" aria-label="Remover imagem">' + ic('x') + '</button>' : '') + '</div>' +
      '<label class="f">Nome</label><input class="input" id="mNome" value="' + esc(m ? m.nome : '') + '" placeholder="Ex.: viagem, notebook"><label class="f">Quanto quero juntar</label><input class="input" id="mAlvo" inputmode="numeric" data-mask="money" value="' + (m ? fmtIn(m.alvo) : '') + '"><label class="f">Até quando</label><input class="input" id="mData" type="month" value="' + (m ? m.data : '') + '"><label class="f">Quanto já tenho guardado</label><input class="input" id="mAtual" inputmode="numeric" data-mask="money" value="' + (m && m.atual ? fmtIn(m.atual) : '') + '"><div style="height:16px"></div><div class="stack"><button class="btn" data-act="saveMeta" data-id="' + (m ? m.id : '') + '">Salvar</button>' + (m ? '<button class="btn danger" data-act="delMeta" data-id="' + m.id + '">Excluir</button>' : '') + '</div>');
  }
  function resizeImg(file, cb) {
    const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const W = 720, k = Math.min(1, W / im.width), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', 0.72)); }; im.onerror = () => toastMsg('Não consegui abrir essa imagem.'); im.src = fr.result; }; fr.readAsDataURL(file);
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return; const fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'mImgIn' && e.target.files[0]) { resizeImg(e.target.files[0], (d) => { metaImg = d; const b = $('mImgBox'); if (b) { b.style.backgroundImage = 'url(' + d + ')'; b.querySelector('span').textContent = 'Trocar imagem'; } }); return; }
    const el = e.target.closest('[data-chg]'); if (!el) return; const c = el.dataset.c;
    if (el.dataset.chg === 'budget') { const v = parseBR(el.value); if (isNaN(v) || v <= 0) delete S.budget[c]; else S.budget[c] = v; save(); render(); }
    else if (el.dataset.chg === 'catColor') { const o = S.cats.find((x) => x.name === c); if (o) { o.color = el.value; save(); } }
    else if (el.dataset.chg === 'catName') { const o = S.cats.find((x) => x.name === c); const n = el.value.trim(); if (o && n && n !== c) { S.tx.forEach((t) => { if (t.cat === c) t.cat = n; }); Object.keys(S.rules).forEach((k) => { if (S.rules[k] === c) S.rules[k] = n; }); if (S.budget[c] != null) { S.budget[n] = S.budget[c]; delete S.budget[c]; } o.name = n; save(); } }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'qIn') { view.q = e.target.value; const l = $('txlist'); if (l) l.innerHTML = txListHtml(); } });
  document.addEventListener('input', (e) => { const el = e.target; if (!el.dataset || el.dataset.mask !== 'money') return; el.value = maskMoney(el.value, el.hasAttribute('data-neg')); try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {} });
  document.addEventListener('focusin', (e) => { const el = e.target; if (el.dataset && el.dataset.mask === 'money') setTimeout(() => { try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {} }, 0); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest('#login')) doLoginAct(); });
  $('fileIn').addEventListener('change', (e) => { if (e.target.files.length) handleFiles([...e.target.files]); });

  /* expõe para testes */
  window.__ft = { get S() { return S; }, set S(v) { S = v; }, render, view };
  window.__ftBooted = true;
  boot();
})();
