<style>
/* Fintrack — mobile first. Identidade: creme quente, card em degradê pastel, serifa itálica no título. */
:root {
  --bg: #f8f1ee; --card: #ffffff; --ink: #241b1e; --muted: #8f8284; --line: #eadfdb; --soft: #f4e3e6;
  --accent: #c4527f; --accent-ink: #ffffff; --ok: #3f8f5f; --warn: #c8741f; --bad: #c0394f;
  --ok-bg: #e4f2e9; --warn-bg: #fbeedd; --bad-bg: #fbe4e8; --alert-bg: #f4e3e5; --alert-ink: #8a2f4a;
  --hero: radial-gradient(120% 130% at 12% 8%, #fbe0e8 0%, rgba(251,224,232,0) 58%), radial-gradient(90% 110% at 92% 18%, #e3d5f1 0%, rgba(227,213,241,0) 62%), radial-gradient(110% 100% at 78% 105%, #f8dac4 0%, rgba(248,218,196,0) 62%), #f7e4e9;
  --hero-line: #ecd3dc; --track: rgba(255,255,255,.78);
  --radius: 24px; --shadow: 0 1px 2px rgba(70,30,40,.04), 0 8px 24px rgba(70,30,40,.05);
  --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#151113; --card:#201a1d; --ink:#f4ede9; --muted:#a3969b; --line:#33292d; --soft:#3a2630; --accent:#d46a93; --accent-ink:#1a0d14; --ok:#6cc08c; --warn:#e69a4d; --bad:#ef7388; --ok-bg:#183024; --warn-bg:#3a2a14; --bad-bg:#3a1a20; --alert-bg:#3a2429; --alert-ink:#f2b3c4;
  --hero: radial-gradient(120% 130% at 12% 8%, #5b2a42 0%, rgba(91,42,66,0) 60%), radial-gradient(90% 110% at 92% 18%, #3d2f5a 0%, rgba(61,47,90,0) 62%), radial-gradient(110% 100% at 78% 105%, #5a3a2c 0%, rgba(90,58,44,0) 62%), #2a1d25; --hero-line:#43303b; --track: rgba(255,255,255,.14); --shadow: none; } }
:root[data-theme="dark"] { --bg:#151113; --card:#201a1d; --ink:#f4ede9; --muted:#a3969b; --line:#33292d; --soft:#3a2630; --accent:#d46a93; --accent-ink:#1a0d14; --ok:#6cc08c; --warn:#e69a4d; --bad:#ef7388; --ok-bg:#183024; --warn-bg:#3a2a14; --bad-bg:#3a1a20; --alert-bg:#3a2429; --alert-ink:#f2b3c4;
  --hero: radial-gradient(120% 130% at 12% 8%, #5b2a42 0%, rgba(91,42,66,0) 60%), radial-gradient(90% 110% at 92% 18%, #3d2f5a 0%, rgba(61,47,90,0) 62%), radial-gradient(110% 100% at 78% 105%, #5a3a2c 0%, rgba(90,58,44,0) 62%), #2a1d25; --hero-line:#43303b; --track: rgba(255,255,255,.14); --shadow: none; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'DM Sans', -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 15px; line-height: 1.4; }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
.serif { font-family: var(--serif); font-style: italic; font-weight: 500; }

#app { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(110px + env(safe-area-inset-bottom)); }
.top { display: grid; grid-template-columns: 52px 1fr 92px; align-items: center; padding: 6px 0 4px; }
.top h1 { font-size: 32px; line-height: 1; text-align: center; letter-spacing: -.01em; }
.top-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; box-shadow: var(--shadow); }
.icon-btn.plain { background: none; border: 0; box-shadow: none; width: 40px; height: 40px; }
.icon-btn svg { width: 22px; height: 22px; }
.sync { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.sync.busy { background: var(--warn); } .sync.off { background: var(--bad); }
.banner { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 14px; margin-bottom: 12px; font-size: 13px; }

.ptabs { position: relative; display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 12px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { flex: none; padding: 12px 18px; border-radius: 99px; font-size: 16px; color: var(--muted); border: 1px solid transparent; }
.ptab.on { background: var(--card); color: var(--accent); border-color: var(--line); box-shadow: var(--shadow); font-weight: 500; }

.card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--line); }
.card h2 { font-size: 17px; font-weight: 600; color: var(--ink); margin-bottom: 10px; }
.card.hero { background: var(--hero); border-color: var(--hero-line); box-shadow: none; }
.big { font-size: 46px; font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.05; }
.big .cur { font-size: .5em; font-weight: 400; margin-right: 5px; letter-spacing: 0; }
.mid { font-size: 21px; font-weight: 500; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; } .between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stack > * + * { margin-top: 10px; }
.money { font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.pos { color: var(--ok); } .neg { color: var(--ink); } .orange { color: var(--warn); }

.bar { height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.bar.ok > i { background: var(--ok); } .bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.bar.grad > i, .bar.grad.ok > i, .bar.grad.warn > i, .bar.grad.bad > i { background-image: linear-gradient(90deg, #4f9a6b 0%, #d9b73c 55%, #d2603e 100%); background-color: transparent; }
.hero .bar { background: var(--track); height: 6px; }
.hero .bar > i, .hero .bar.ok > i { background: var(--ink); } .hero .bar.warn > i { background: var(--warn); } .hero .bar.bad > i { background: var(--bad); }

.fab { position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 58px; height: 58px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 32px; line-height: 1; box-shadow: 0 10px 26px rgba(196,82,127,.38); z-index: 25; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 9px 15px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.btn { padding: 15px 18px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-weight: 600; width: 100%; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.small { padding: 10px 16px; width: auto; font-size: 13px; }
.link { color: var(--accent); font-weight: 600; font-size: 13px; }
.input { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); outline: none; }
.input:focus { border-color: var(--accent); }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; }

.tx { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.tx:last-child { border-bottom: 0; }
.tx .ic { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; }
.tx .ic svg { width: 20px; height: 20px; }
.tx .mid-col { flex: 1; min-width: 0; }
.tx .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .sub { display: flex; gap: 6px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
.acc { font-size: 11px; color: var(--muted); }
.day { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 14px 2px 4px; display: flex; justify-content: space-between; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.check.on { background: var(--accent); border-color: var(--accent); }

.cat-row { padding: 10px 0; }
.cat-row .row { margin-bottom: 6px; }
.note { padding: 13px 15px; border-radius: 16px; font-size: 14px; }
.note.warn { background: var(--warn-bg); } .note.ok { background: var(--ok-bg); } .note.bad { background: var(--bad-bg); }
.alert { display: flex; align-items: center; gap: 12px; background: var(--alert-bg); color: var(--alert-ink); border-radius: 24px; padding: 12px 12px 12px 14px; margin-bottom: 14px; }
.alert .ai { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
.alert .ai svg { width: 20px; height: 20px; }
.alert b { flex: 1; font-weight: 500; font-size: 16px; }
.opt { display: block; width: 100%; text-align: left; padding: 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); margin-bottom: 10px; }
.opt b { display: block; margin-bottom: 2px; } .opt span { color: var(--muted); font-size: 13px; }
.opt.on { border-color: var(--accent); background: var(--soft); }
.verdict { border-radius: 24px; padding: 20px; margin-bottom: 14px; }
.verdict.pode { background: var(--ok-bg); } .verdict.cabe, .verdict.espere { background: var(--warn-bg); } .verdict.nao { background: var(--bad-bg); }
.verdict h2 { font-family: var(--serif); font-style: italic; font-size: 30px; font-weight: 600; margin-bottom: 6px; }
.menu-item { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 16px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.menu-item:last-child { border-bottom: 0; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.seg { display: flex; background: var(--line); border-radius: 99px; padding: 4px; gap: 3px; margin-bottom: 10px; }
.seg button { flex: 1; padding: 9px; border-radius: 99px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--accent); box-shadow: var(--shadow); }
.mnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.mnav button.arrow { width: 52px; height: 52px; border-radius: 50%; background: none; border: 1px solid var(--line); font-size: 20px; color: var(--ink); }
.mnav .mid-lbl { text-align: center; display: block; }
.mnav .mid-lbl b { display: inline-block; font-weight: 600; font-size: 16px; }
.mnav .mid-lbl span { color: var(--muted); font-size: 13px; margin-left: 6px; }
.cap { display: inline-block; } .cap::first-letter, .mnav b::first-letter { text-transform: uppercase; }
.selbar { position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; padding: 10px 16px; z-index: 22; }

.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: rgba(30,12,20,.45); }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 30px 30px 0 0; padding: 12px 18px calc(24px + env(safe-area-inset-bottom)); animation: up .22s ease-out; }
.sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.toast { white-space: pre-line; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 18px; z-index: 80; font-size: 14px; max-width: 90vw; text-align: center; }

.login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 380px; margin: 0 auto; padding: 24px; }
.login h1 { font-family: var(--serif); font-style: italic; font-size: 44px; font-weight: 600; margin-bottom: 6px; } .login p { color: var(--muted); margin-bottom: 22px; }
.login .input { margin-bottom: 10px; } .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-bottom: 8px; }

</style>

<script>
/* Fintrack — leitores de extrato/fatura (Itaú). Funciona no navegador e no Node (testes). */
(function (root) {
  'use strict';

  const brNum = (s) => {
    if (s == null) return NaN;
    if (typeof s === 'number') return s;
    const t = String(s).replace(/R\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
    return parseFloat(t);
  };
  const iso = (d, m, y) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const cleanName = (s) => s.replace(/\s+/g, ' ').trim();

  /* ---------- Categoria do cartão Itaú -> categoria Fintrack ---------- */
  const CARD_CAT = {
    'transporte': 'Transporte', 'supermercado': 'Alimentação', 'restaurante': 'Alimentação',
    'serviços': 'Assinaturas', 'saúde': 'Saúde', 'lazer': 'Lazer', 'casa': 'Moradia',
    'vestuário': 'Vestuário', 'educação': 'Educação', 'viagem': 'Lazer', 'eletronicos': 'Compras',
    'outros': null
  };

  /* ---------- PDF de fatura do cartão Itaú ----------
     Entrada: lista de páginas, cada uma com items {str,x,y}. (gerado por pdf.js)
     Saída: {lancamentos[], parcelasFuturas[], resumo{}} */
  function groupLines(items, pageWidth) {
    // acha as âncoras de coluna pela posição X das datas "DD/MM"
    const dateX = items.filter(i => /^\d{2}\/\d{2}$/.test(i.str.trim())).map(i => Math.round(i.x));
    const uniq = [...new Set(dateX)].sort((a, b) => a - b);
    const left = uniq.length ? uniq[0] : 0;
    const rightC = uniq.find(x => x - left > 120);
    const splitX = rightC != null ? rightC - 6 : Infinity;
    const cols = { L: [], R: [] };
    items.forEach(it => { if (it.str.trim()) (it.x >= splitX ? cols.R : cols.L).push(it); });
    const out = [];
    ['L', 'R'].forEach(c => {
      const rows = [];
      cols[c].sort((a, b) => b.y - a.y || a.x - b.x).forEach(it => {
        const r = rows.find(r => Math.abs(r.y - it.y) < 2.5);
        if (r) r.items.push(it); else rows.push({ y: it.y, items: [it] });
      });
      rows.sort((a, b) => b.y - a.y).forEach(r => {
        r.items.sort((a, b) => a.x - b.x);
        let txt = '', prevEnd = null;
        r.items.forEach(i => {
          const gap = prevEnd == null ? 0 : i.x - prevEnd;
          if (prevEnd != null && gap > 1.2) txt += ' ';
          txt += i.str.trim(); prevEnd = i.x + (i.w || 0);
        });
        out.push({ col: c, y: r.y, text: cleanName(txt), cells: r.items });
      });
    });
    return out;
  }

  function parseItauCardPages(pages) {
    const lines = [];
    pages.forEach((p, pi) => groupLines(p.items, p.width).forEach(l => lines.push({ ...l, page: pi })));
    const full = lines.map(l => l.text).join('\n');

    const resumo = {};
    const m = (re) => { const r = full.match(re); return r ? r[1] : null; };
    resumo.total = brNum(m(/Total desta fatura\s+([\d.]+,\d{2})/));
    resumo.vencimento = m(/Vencimento:\s*(\d{2}\/\d{2}\/\d{4})/);
    resumo.fechamento = m(/Postagem:\s*(\d{2}\/\d{2}\/\d{4})/);
    resumo.proxFechamento = m(/pr[óo]x\.? Fechamento:\s*(\d{2}\/\d{2}\/\d{4})/i);
    resumo.limite = brNum(m(/Limite total de cr[ée]dito\s+([\d.]+,\d{2})/));
    resumo.limiteDisponivel = brNum(m(/Limite dispon[ií]vel\s+([\d.]+,\d{2})/));
    resumo.faturaAnterior = brNum(m(/Total da fatura anterior\s+([\d.]+,\d{2})/));
    const pag = full.match(/Pagamento efetuado em (\d{2}\/\d{2}\/\d{4})\s+-?([\d.]+,\d{2})/);
    if (pag) { resumo.pagamentoData = pag[1]; resumo.pagamentoValor = brNum(pag[2]); }

    // ano de referência: vencimento (fatura que vence em out/2026 tem compras de ago-out/2026)
    const refYear = resumo.vencimento ? +resumo.vencimento.slice(6) : new Date().getFullYear();
    const refMonth = resumo.vencimento ? +resumo.vencimento.slice(3, 5) : 12;
    const yearFor = (mm) => (mm > refMonth ? refYear - 1 : refYear);

    const lancamentos = [], parcelasFuturas = [];
    let section = null; // 'compras' | 'inter' | 'prodserv' | 'futuras' | 'pagamentos' | null
    const reItem = /^(\d{2})\/(\d{2})\s+(.+?)\s+(-?[\d.]+,\d{2})$/;
    const reItemInter = /^(\d{2})\/(\d{2})\s+(.+?)\s+(-?[\d.]+,\d{2})$/;
    const reInst = /\s(\d{2})\/(\d{2})$/;

    for (let i = 0; i < lines.length; i++) {
      const t = lines[i].text;
      if (/^Pagamentos efetuados/i.test(t)) { section = 'pagamentos'; continue; }
      if (/^Lançamentos: compras e saques/i.test(t)) { section = 'compras'; continue; }
      if (/^Lançamentos internacionais/i.test(t)) { section = 'inter'; continue; }
      if (/^Lançamentos: produtos e serviços/i.test(t)) { section = 'prodserv'; continue; }
      if (/^Compras parceladas - próximas faturas/i.test(t)) { section = 'futuras'; continue; }
      if (/^(Limites de cr[ée]dito|Encargos cobrados)/i.test(t)) { section = null; continue; }
      if (/^(Total dos pagamentos|Lançamentos no cartão|Total transações inter|Total dos lançamentos|Próxima fatura|Demais faturas|Total para próximas)/i.test(t)) continue;
      if (section === 'pagamentos') continue;

      if (section === 'compras' || section === 'prodserv') {
        const mm = t.match(reItem);
        if (!mm || /^(DATA)/.test(t)) continue;
        const dia = +mm[1], mes = +mm[2];

<script>

  const DEFAULT_CATS = [

    [/NETFLIX|SPOTIFY|DEEZER|YOUTUBE|APPLE\.COM|MUBI|DISNEY|AMAZON PRIME|CLAUDE|ANTHROPIC|HBO|GOOGLE/i, 'Assinaturas'],
    [/PANVEL|FARMAC|DROGA|ZENKLUB|CLINICA|HOSPITAL|UNIMED|DENTIST/i, 'Saúde'], [/PETLOVE|PETZ|COBASI|VETERIN/i, 'Pet'],
    [/SHEIN|RENNER|C&A|ZARA|VESTU/i, 'Vestuário'], [/SYMPLA|CINEMA|INGRESSO|MUSEU|BRINQUEDO/i, 'Lazer'],
    [/CLARO|VIVO|TIM\b|OI\b/i, 'Telefone'], [/ALUGUEL|CONDOM|LUZ|CEEE|RGE|CORSAN|NET\b|ENERGIA/i, 'Moradia'], [/FATURA PAGA/i, 'Cartão de Crédito'], [/PIX|TED\b|DOC\b|TRANSF/i, 'PIX'], [/BOLETO/i, 'Outros']

  const r2 = (n) => Math.round(n * 100) / 100;
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const ym = (d) => d.slice(0, 7);

  function newState() {
    return {
      v: 2, cats: JSON.parse(JSON.stringify(DEFAULT_CATS)), rules: {}, tx: [], budget: {}, metas: [], decisoes: [],
      faturas: [], settings: { renda: 0, limitePct: 90, saldoConta: null, saldoData: null, reservaAlvo: 0, reservaAtual: 0, reservaMeses: 6, tema: 'auto' }, dismissed: {}

  }

  /* chave de aprendizado de um estabelecimento */
  function ruleKey(nome) {
    const toks = String(nome).toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
    if (!toks.length) return '';

    return k;
  }
  function guessCat(S, nome, cartaoCatSugerida) {
    const k = ruleKey(nome);
    if (S.rules[k]) return S.rules[k];
    for (const [re, c] of GUESS) if (re.test(nome)) return c;
    return cartaoCatSugerida || null;
  }

  /* importa linhas de extrato/fatura: mescla com lançamentos manuais e evita duplicidade */
  function importLines(S, lines, source, meta) {
    const res = { novos: 0, duplicados: 0, mesclados: 0, perguntar: [] };
    lines.forEach(l0 => {
      const l = Object.assign({}, l0);
      if (meta && meta.fechamentoISO && l.parcela && l.parcela.n > 1) { l.dataCompra = l.data; l.data = meta.fechamentoISO; }
      const conta = l.origem === 'cartao' ? 'cartao' : 'cc';
      // duplicado exato (mesma data, valor e nome, já veio de arquivo)
      const dup = S.tx.find(t => t.origem !== 'manual' && t.conta === conta && (t.data === l.data || t.dataCompra === l.data) && Math.abs(t.valor - l.valor) < 0.005 && t.nomeOrig === l.nome && !t._m);
      if (dup && S._seen && S._seen.has(dup.id)) { /* linha idêntica legítima no mesmo arquivo */ }
      else if (dup) { res.duplicados++; return; }
      // manual correspondente (mesmo valor, data até 4 dias de distância)
      const man = S.tx.find(t => t.origem === 'manual' && !t.casado && Math.abs(t.valor - l.valor) < 0.005 &&
        Math.abs((new Date(t.data) - new Date(l.data)) / 864e5) <= 4 && (t.conta === conta || !t.conta));
      if (man) {
        man.casado = true; man.origem = source; man.data = l.data; man.nomeOrig = l.nome; man.conta = conta;
        man.parcela = l.parcela || man.parcela; res.mesclados++; markSeen(S, man.id); return;
      }

      const transfer = !!l.transferenciaFatura || invest;
      const k0 = ruleKey(l.nome);
      let cat = transfer ? (invest ? 'Transferência' : 'Cartão de Crédito') : S.rules[k0] || (l.valor > 0 && conta === 'cc' ? 'Receita' : guessCat(S, l.nome, l.categoriaSugerida));
      const t = { id: uid(), data: l.data, nome: l.nome, nomeOrig: l.nome, valor: l.valor, conta, cat, origem: source, parcela: l.parcela || null, transfer, internacional: !!l.internacional, dataCompra: l.dataCompra || null, fat: meta && meta.fechamentoISO ? meta.fechamentoISO.slice(0, 7) : null };
      S.tx.push(t); markSeen(S, t.id); res.novos++;

  }
  function markSeen(S, id) { (S._seen = S._seen || new Set()).add(id); }

  function addManual(S, { data, nome, valor, cat, conta }) {
    const t = { id: uid(), data, nome, nomeOrig: nome, valor: -Math.abs(valor), conta: conta || 'cartao', cat: cat || guessCat(S, nome) || 'Outros', origem: 'manual', parcela: null, transfer: false };
    S.tx.push(t); return t;
  }
  function learn(S, tx, cat) {
    tx.cat = cat; const k = ruleKey(tx.nomeOrig || tx.nome); if (k) S.rules[k] = cat;
    S.tx.forEach(o => { if (!o.cat && ruleKey(o.nomeOrig || o.nome) === k) o.cat = cat; });
  }

  /* ---------- agregações ---------- */
  const isExpense = (t) => !t.transfer && t.cat !== 'Receita' && !(t.valor > 0 && t.conta === 'cc');
  const isIncome = (t) => !t.transfer && (t.cat === 'Receita' || (t.valor > 0 && t.conta === 'cc'));
  function monthStats(S, month) {
    const tx = S.tx.filter(t => ym(t.data) === month);
    const gasto = r2(-tx.filter(isExpense).reduce((s, t) => s + t.valor, 0));
    const receita = r2(tx.filter(isIncome).reduce((s, t) => s + t.valor, 0));
    const porCat = {};
    tx.filter(isExpense).forEach(t => { const c = t.cat || 'Sem categoria'; porCat[c] = r2((porCat[c] || 0) - t.valor); });
    return { gasto, receita, porCat, n: tx.length };
  }
  function monthsWithData(S) { return [...new Set(S.tx.map(t => ym(t.data)))].sort(); }

  /* ---------- parcelamentos ---------- */
  function parcelamentos(S, today) {
    const series = {};
    S.tx.filter(t => t.parcela && t.conta === 'cartao').forEach(t => {
      const k = ruleKey(t.nomeOrig || t.nome) + '|' + t.parcela.de + '|' + r2(Math.abs(t.valor)).toFixed(0);
      const cur = series[k];
      if (!cur || t.parcela.n > cur.n) series[k] = { nome: t.nome, n: t.parcela.n, de: t.parcela.de, valor: Math.abs(t.valor), ultima: t.data, fat: t.fat || null, cat: t.cat };
    });

    const out = {}; for (let i = 0; i < count; i++) out[addMonths(from, i)] = 0;

  /* ---------- recorrentes ---------- */
  function recorrentes(S) {
    const meses = monthsWithData(S);
    if (meses.length < 3) return { pronto: false, faltam: 3 - meses.length, itens: [] };
    const g = {};
    S.tx.filter(t => isExpense(t) && t.valor < 0 && !t.parcela).forEach(t => {
      const k = ruleKey(t.nomeOrig || t.nome) + '|' + (t.cat || '');
      (g[k] = g[k] || { nome: t.nome, cat: t.cat, itens: [] }).itens.push(t);
    });
    const itens = [];
    Object.values(g).forEach(x => {
      const porMes = {}; x.itens.forEach(t => { (porMes[ym(t.data)] = porMes[ym(t.data)] || []).push(Math.abs(t.valor)); });
      const ms = Object.keys(porMes).sort(); if (ms.length < 3) return;
      const vals = ms.map(m => porMes[m].reduce((a, b) => a + b, 0) / (porMes[m].length));
      if (porMes[ms[0]].length > 1 && ms.every(m => porMes[m].length > 2)) return; // muito frequente (ex.: transporte) não é recorrente fixo
      const med = [...vals].sort((a, b) => a - b)[Math.floor(vals.length / 2)];

  }

  /* ---------- plano / livre ---------- */
  function planoMes(S) {
    const lim = Object.values(S.budget).reduce((s, v) => s + (+v || 0), 0);
    const teto = S.settings.renda ? r2(S.settings.renda * S.settings.limitePct / 100) : 0;
    return { teto, somaLimites: r2(lim), plano: lim > 0 ? r2(lim) : teto };
  }
  function visaoMes(S, today) {
    const month = ym(today); const st = monthStats(S, month); const P = parcelamentos(S, today);
    const pl = planoMes(S);
    // parcelas que ainda vão cair neste mês (série cuja última cobrança foi antes do mês)
    const pend = r2(P.filter(p => p.meses[0] === month).reduce((s, p) => s + p.valor, 0));

  }

  /* sugestão de limites após >=2 meses completos: média por categoria */
  function sugerirLimites(S, today) {
    const ms = monthsWithData(S).filter(m => m < ym(today));
    if (ms.length < 2) return null;
    const soma = {}; ms.forEach(m => { const st = monthStats(S, m); Object.entries(st.porCat).forEach(([c, v]) => soma[c] = (soma[c] || 0) + v); });
    const out = {}; Object.entries(soma).forEach(([c, v]) => { if (c !== 'Sem categoria') out[c] = Math.ceil(v / ms.length / 10) * 10; });
    return out;
  }

  /* ---------- Decidir ---------- */
  const JUROS_AM = 0.0599;
  function pmt(pv, i, n) { return i === 0 ? pv / n : pv * i / (1 - Math.pow(1 + i, -n)); }

    const v = visaoMes(S, today); const renda = S.settings.renda; const teto = renda * S.settings.limitePct / 100;
    if (!renda) return { veredito: 'sem-renda', titulo: 'Informe sua renda', texto: 'Preciso da sua renda mensal (em Mais > Ajustes) para avaliar se cabe.' };

    if (necessidade === 'impulso') { texto = 'Compra por impulso: espere até amanhã antes de decidir. ' + texto; if (veredito === 'pode') { titulo = 'Espere até amanhã'; veredito = 'espere'; } }

  /* ---------- reserva e metas ---------- */
  function reserva(S, today) {

    return { v, rows };
  }
  function vOrcamento() {
    const { v, rows } = orcData(); const sug = E.sugerirLimites(S, today()); const meses = E.monthsWithData(S).length;

    } else {

      h += '<div class="card hero"><div class="row between small muted"><span>Plano de ' + esc(nomeMes) + '</span><span>' + brl0(v.plano.plano) + '</span></div><div style="margin:8px 0 14px">' + bigMoney(v.posso) + ' <span class="muted">' + (v.posso < 0 ? 'acima do plano' : 'livres') + '</span></div><div class="bar ' + cls + '"><i style="width:' + Math.min(100, pct) + '%"></i></div><div class="row between small muted" style="margin-top:8px"><span>Gastou ' + brl0(v.gasto) + (v.parcelasPendentes ? ' + ' + brl0(v.parcelasPendentes) + ' em parcelas a cair' : '') + '</span><span>' + Math.round(pct) + '%</span></div></div>';

    const vals = rows.map((r) => ({ c: r.c, x: modo === 'plano' ? r.lim : r.g })).filter((r) => r.x > 0); const tot = vals.reduce((s, r) => s + r.x, 0);

  /* ---------- importação ---------- */
  async function readFileLines(file) {
    const name = file.name.toLowerCase();
    if (name.endsWith('.pdf')) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const doc = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; const pages = [];
      for (let i = 1; i <= doc.numPages; i++) { const pg = await doc.getPage(i); const vp = pg.getViewport({ scale: 1 }); const tc = await pg.getTextContent(); pages.push({ width: vp.width, items: tc.items.map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5], w: it.width })) }); }
      const r = P.parseItauCardPages(pages);
      if (!r.lancamentos.length || !r.resumo.total) throw new Error('Não reconheci essa fatura. Se puder, envie o arquivo da fatura em CSV ou o PDF original do Itaú.');
      const iso = (s) => s ? s.slice(6) + '-' + s.slice(3, 5) + '-' + s.slice(0, 2) : null;
      return { lines: r.lancamentos, source: 'fatura', meta: { vencimento: r.resumo.vencimento, vencimentoISO: iso(r.resumo.vencimento), fechamentoISO: iso(r.resumo.fechamento), total: r.resumo.total, limite: r.resumo.limite }, check: Math.abs(r.resumo.somaLancamentos - r.resumo.total) < 0.02 };
    }
    if (/\.(xls|xlsx)$/.test(name)) {
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' }); const sh = wb.Sheets['Lançamentos'] || wb.Sheets[wb.SheetNames[0]];
      const r = P.parseItauXLS(XLSX.utils.sheet_to_json(sh, { header: 1, raw: true }), new Date());
      if (!r.transacoes.length) throw new Error('Não encontrei lançamentos nesse Excel.');
      return { lines: r.transacoes, source: 'extrato' };
    }
    const txt = await file.text();
    const lines = name.endsWith('.ofx') ? P.parseOFX(txt) : P.parseCSV(txt);
    if (!lines.length) throw new Error('Não consegui ler esse arquivo.');
    return { lines, source: 'extrato' };
  }
  async function handleFiles(files) {
    closeSheet(); let msg = [];
    for (const f of files) {
      toastMsg('Lendo ' + f.name + '…');
      try {
        const r = await readFileLines(f); const res = E.importLines(S, r.lines, r.source, r.meta);
        msg.push((r.source === 'fatura' ? 'Fatura' : 'Extrato') + ': ' + res.novos + ' novos' + (res.mesclados ? ', ' + res.mesclados + ' mesclados com seus lançamentos' : '') + (res.duplicados ? ', ' + res.duplicados + ' já existiam' : '') + (r.check === false ? ' (confira o total!)' : ''));
      } catch (e) { msg.push(f.name + ': ' + e.message); }
    }
    save(); view.month = null; render(); toastMsg(msg.join('\n')); maybeAsk(true);
  }

    dForma: (el) => { dec.forma = el.dataset.v; if (dec.forma === 'parcelado') { dec.step = 4; render(); } else calcDecisao(); },
    dJuros: (el) => { dec.juros = el.dataset.v; [...el.parentNode.children].forEach((b) => b.classList.toggle('on', b === el)); },
    dCalc: () => { dec.parcelas = String(parseInt($('dParc').value, 10) || 2); if (!dec.juros) return toastMsg('Diga se tem juros.'); calcDecisao(); },
    dBack: () => { dec.step = dec.step === 4 ? 3 : dec.step - 1; render(); }, dReset: () => { dec = { step: 0, item: '', nec: '', preco: '', forma: '', parcelas: '6', juros: '', res: null }; render(); },
    dSave: (el) => {
      const v = el.dataset.v; const base = { id: E.uid(), item: dec.item, nec: dec.nec, preco: +dec.preco, criada: today(), veredito: dec.res && dec.res.veredito };
      S.decisoes.push(v === 'amanha' ? { ...base, status: 'pendente', seguir: tomorrow() } : { ...base, status: v });
      save(); toastMsg(v === 'amanha' ? 'Combinado. Amanhã eu pergunto de novo.' : v === 'comprei' ? 'Anotado' : 'Boa decisão'); A.dReset();
    },
    decStill: (el) => { const d = S.decisoes.find((x) => x.id === el.dataset.id); if (d) { dec = { step: 1, item: d.item, nec: d.nec || '', preco: String(d.preco), forma: '', parcelas: '6', juros: '', res: null }; d.status = 'ainda'; save(); view.name = 'decidir'; render(); } },
    decDrop: (el) => { const d = S.decisoes.find((x) => x.id === el.dataset.id); if (d) { d.status = 'desisti'; save(); render(); toastMsg('Boa decisão'); } },
    /* ajustes */
    catsMgr: () => { openSheet('<h3>Categorias</h3><div style="height:8px"></div>' + S.cats.map((c) => '<div class="row" style="margin-bottom:8px"><input type="color" value="' + c.color + '" data-chg="catColor" data-c="' + esc(c.name) + '" style="width:44px;height:44px;border:0;background:none"><input class="input" value="' + esc(c.name) + '" data-chg="catName" data-c="' + esc(c.name) + '"><button class="link" data-act="catDel" data-c="' + esc(c.name) + '">Excluir</button></div>').join('') + '<div class="row"><input class="input" id="catNew" placeholder="Nova categoria"><button class="btn small" data-act="catAdd">Adicionar</button></div>'); },
    catAdd: () => { const n = $('catNew').value.trim(); if (n && !S.cats.some((c) => c.name.toLowerCase() === n.toLowerCase())) { S.cats.push({ id: E.uid(), name: n, color: '#b03d6e' }); save(); A.catsMgr(); } },
    catDel: (el) => { const n = el.dataset.c; if (S.tx.some((t) => t.cat === n)) return toastMsg('Há lançamentos nessa categoria. Mude-os antes.'); S.cats = S.cats.filter((c) => c.name !== n); save(); A.catsMgr(); },
    exportBk: () => { const { _seen, ...clean } = S; const b = new Blob([JSON.stringify(clean)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'fintrack-backup-' + today() + '.json'; a.click(); },
    importBk: () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (!d.tx || !d.cats) throw 0; if (!confirm('Substituir os dados atuais pelo backup?')) return; S = normalize(d); save(); render(); toastMsg('Backup importado'); } catch (e) { toastMsg('Arquivo de backup inválido.'); } }; i.click(); },
    wipe: () => { if (!confirm('Apagar TODOS os dados? Isso não pode ser desfeito.')) return; S = E.newState(); save(); view.month = null; render(); toastMsg('Dados apagados'); },
    logout: async () => { closeSheet(); if (confirm('Sair deste aparelho?')) await doLogout(false); },
    toggleLogin: () => { loginMode = loginMode === 'login' ? 'register' : 'login'; showLogin(); }, doLogin: doLoginAct
  };
  function calcDecisao() { dec.res = E.decidir(S, today(), { necessidade: dec.nec, preco: +dec.preco, forma: dec.forma, parcelas: +dec.parcelas, juros: dec.juros }); dec.step = 5; render(); }
  function sheetMeta(m) {
    openSheet('<h3>' + (m ? 'Editar meta' : 'Nova meta') + '</h3><label class="f">Nome</label><input class="input" id="mNome" value="' + esc(m ? m.nome : '') + '" placeholder="Ex.: viagem, notebook"><label class="f">Quanto quero juntar</label><input class="input" id="mAlvo" inputmode="numeric" data-mask="money" value="' + (m ? fmtIn(m.alvo) : '') + '"><label class="f">Até quando</label><input class="input" id="mData" type="month" value="' + (m ? m.data : '') + '"><label class="f">Quanto já tenho</label><input class="input" id="mAtual" inputmode="numeric" data-mask="money" value="' + (m && m.atual ? fmtIn(m.atual) : '') + '"><div style="height:16px"></div><div class="stack"><button class="btn" data-act="saveMeta" data-id="' + (m ? m.id : '') + '">Salvar</button>' + (m ? '<button class="btn danger" data-act="delMeta" data-id="' + m.id + '">Excluir</button>' : '') + '</div>');
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return; const fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-chg]'); if (!el) return; const c = el.dataset.c;
    if (el.dataset.chg === 'budget') { const v = parseBR(el.value); if (isNaN(v) || v <= 0) delete S.budget[c]; else S.budget[c] = v; save(); render(); }
    else if (el.dataset.chg === 'catColor') { const o = S.cats.find((x) => x.name === c); if (o) { o.color = el.value; save(); } }
    else if (el.dataset.chg === 'catName') { const o = S.cats.find((x) => x.name === c); const n = el.value.trim(); if (o && n && n !== c) { S.tx.forEach((t) => { if (t.cat === c) t.cat = n; }); Object.keys(S.rules).forEach((k) => { if (S.rules[k] === c) S.rules[k] = n; }); if (S.budget[c] != null) { S.budget[n] = S.budget[c]; delete S.budget[c]; } o.name = n; save(); } }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'qIn') { view.q = e.target.value; const l = $('txlist'); if (l) l.innerHTML = txListHtml(); } });
  document.addEventListener('input', (e) => { const el = e.target; if (!el.dataset || el.dataset.mask !== 'money') return; el.value = maskMoney(el.value, el.hasAttribute('data-neg')); try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {} });
  document.addEventListener('focusin', (e) => { const el = e.target; if (el.dataset && el.dataset.mask === 'money') setTimeout(() => { try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {} }, 0); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest('#login')) doLoginAct(); });
  $('fileIn').addEventListener('change', (e) => { if (e.target.files.length) handleFiles([...e.target.files]); });

  /* expõe para testes */
  window.__ft = { get S() { return S; }, set S(v) { S = v; }, render, view };
  window.__ftBooted = true;
  boot();
})();

</script>
</body>
</html>
